<style>
/* =========================================================
   XRPShield — Password Recovery
   ========================================================= */

.xps-recovery-page {
    position: relative;
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    overflow: hidden;
}

/* Ambient background */
.xps-recovery-page::before {
    content: "";
    position: absolute;
    width: 520px;
    height: 520px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(0,242,254,.075) 0%,
            rgba(99,102,241,.045) 34%,
            transparent 68%
        );
    filter: blur(10px);
    pointer-events: none;
}

.xps-recovery-page::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );
    background-size: 42px 42px;
    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 25%,
        black 75%,
        transparent
    );
    pointer-events: none;
}

/* ---------- CARD ---------- */

.xps-recovery-card {
    position: relative;
    z-index: 2;
    width: min(470px, 100%);
    padding: 38px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.085);
    background:
        linear-gradient(
            145deg,
            rgba(16,24,42,.94),
            rgba(7,12,24,.97)
        );
    box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        0 0 50px rgba(0,242,254,.035),
        inset 0 1px 0 rgba(255,255,255,.045);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

/* Top glow */
.xps-recovery-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,242,254,.55),
        rgba(124,58,237,.45),
        transparent
    );
}

/* ---------- BRAND ---------- */

.xps-recovery-brand {
    width: 62px;
    height: 62px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    position: relative;
    border-radius: 17px;
    border: 1px solid rgba(0,242,254,.28);
    background:
        linear-gradient(
            145deg,
            rgba(0,242,254,.13),
            rgba(124,58,237,.13)
        );
    color: #fff;
    font-size: 1.55rem;
    font-weight: 900;
    letter-spacing: -.04em;
    box-shadow:
        0 0 28px rgba(0,242,254,.09),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.xps-recovery-brand::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 20px;
    border: 1px solid rgba(0,242,254,.07);
}

.xps-recovery-brand::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    right: 2px;
    bottom: 3px;
    border-radius: 50%;
    background: var(--accent-emerald);
    box-shadow:
        0 0 12px rgba(16,185,129,.9);
}

/* ---------- HEADING ---------- */

.xps-recovery-eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 9px;
    color: var(--primary-cyan);
    font-size: .68rem;
    font-weight: 850;
    letter-spacing: .14em;
    text-transform: uppercase;
}

.xps-recovery-eyebrow span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary-cyan);
    box-shadow: 0 0 10px rgba(0,242,254,.8);
}

.xps-recovery-title {
    margin: 0;
    text-align: center;
    font-size: clamp(1.55rem, 4vw, 1.85rem);
    font-weight: 850;
    letter-spacing: -.035em;
    color: #fff;
}

.xps-recovery-description {
    max-width: 360px;
    margin: 9px auto 28px;
    color: var(--text-secondary);
    text-align: center;
    font-size: .86rem;
    line-height: 1.65;
}

/* ---------- SECURITY STRIP ---------- */

.xps-recovery-security {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 23px;
    padding: 11px 13px;
    border-radius: 10px;
    background: rgba(16,185,129,.045);
    border: 1px solid rgba(16,185,129,.11);
}

.xps-recovery-security-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: rgba(16,185,129,.09);
    color: var(--accent-emerald);
    font-size: .82rem;
}

.xps-recovery-security-text {
    color: var(--text-secondary);
    font-size: .69rem;
    line-height: 1.45;
}

.xps-recovery-security-text strong {
    display: block;
    margin-bottom: 1px;
    color: var(--accent-emerald);
    font-size: .7rem;
}

/* ---------- FORM ---------- */

.xps-recovery-form-group {
    margin-bottom: 20px;
}

.xps-recovery-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    color: var(--text-secondary);
    font-size: .74rem;
    font-weight: 750;
}

.xps-recovery-label-required {
    color: var(--text-muted);
    font-size: .65rem;
    font-weight: 500;
}

.xps-recovery-input-wrap {
    position: relative;
}

.xps-recovery-input-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: .85rem;
    pointer-events: none;
    transition: color .18s ease;
}

.xps-recovery-input {
    width: 100%;
    box-sizing: border-box;
    height: 48px;
    padding: 0 14px 0 39px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.085);
    outline: none;
    background: rgba(0,0,0,.28);
    color: var(--text-primary);
    font: inherit;
    font-size: .86rem;
    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.xps-recovery-input::placeholder {
    color: var(--text-muted);
}

.xps-recovery-input:hover {
    border-color: rgba(255,255,255,.14);
}

.xps-recovery-input:focus {
    border-color: rgba(0,242,254,.42);
    background: rgba(0,0,0,.34);
    box-shadow:
        0 0 0 3px rgba(0,242,254,.055),
        0 0 22px rgba(0,242,254,.035);
}

.xps-recovery-input:focus
~ .xps-recovery-input-icon {
    color: var(--primary-cyan);
}

/* ---------- SUBMIT BUTTON ---------- */

.xps-recovery-submit {
    width: 100%;
    height: 48px;
    margin-top: 2px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid rgba(0,242,254,.32);
    background:
        linear-gradient(
            110deg,
            rgba(0,242,254,.17),
            rgba(99,102,241,.17),
            rgba(124,58,237,.16)
        );
    background-size: 200% 100%;
    color: #fff;
    font-size: .84rem;
    font-weight: 850;
    letter-spacing: .01em;
    cursor: pointer;
    box-shadow:
        0 10px 28px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.06);
    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background-position .35s ease;
}

.xps-recovery-submit:hover {
    transform: translateY(-2px);
    border-color: rgba(0,242,254,.58);
    background-position: 100% 0;
    box-shadow:
        0 14px 32px rgba(0,0,0,.3),
        0 0 25px rgba(0,242,254,.08);
}

.xps-recovery-submit:active {
    transform: translateY(0);
}

.xps-recovery-submit-content {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
}

.xps-recovery-submit-arrow {
    color: var(--primary-cyan);
    font-size: 1rem;
}

/* ---------- FOOTER ---------- */

.xps-recovery-footer {
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.055);
    text-align: center;
    color: var(--text-muted);
    font-size: .75rem;
}

.xps-recovery-footer a {
    color: var(--primary-cyan);
    text-decoration: none;
    font-weight: 700;
    transition: color .18s ease;
}

.xps-recovery-footer a:hover {
    color: #fff;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 560px) {
    .xps-recovery-page {
        padding: 25px 14px;
    }

    .xps-recovery-card {
        padding: 27px 21px;
        border-radius: 18px;
    }

    .xps-recovery-description {
        margin-bottom: 23px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .xps-recovery-submit,
    .xps-recovery-input,
    .xps-recovery-input-icon {
        transition: none;
    }
}
</style>


<!-- =========================================================
     XRPShield — SECURE PASSWORD RECOVERY
     ========================================================= -->

<div class="xps-recovery-page">

    <div class="xps-recovery-card">

        <!-- BRAND -->
        <div class="xps-recovery-brand">
            X
        </div>


        <!-- HEADING -->
        <div class="xps-recovery-eyebrow">
            <span></span>
            Account Security
        </div>

        <h2 class="xps-recovery-title">
            Reset Password
        </h2>

        <p class="xps-recovery-description">
            Enter your registered email address and we'll send
            instructions to securely recover access to your account.
        </p>


        <!-- SECURITY NOTICE -->
        <div class="xps-recovery-security">

            <div class="xps-recovery-security-icon">
                ✓
            </div>

            <div class="xps-recovery-security-text">

                <strong>
                    Secure recovery process
                </strong>

                Your account credentials are never displayed
                or exposed during password recovery.

            </div>

        </div>


        <!-- FORM -->
        <form
            id="forgot-form"
            onsubmit="
                event.preventDefault();
                alert('Password reset verification link sent to your registered email address.');
                window.location.hash = 'login';
            "
        >

            <div class="xps-recovery-form-group">

                <label
                    class="xps-recovery-label"
                    for="recovery-email"
                >
                    <span>Email Address</span>
                    <span class="xps-recovery-label-required">
                        Required
                    </span>
                </label>

                <div class="xps-recovery-input-wrap">

                    <input
                        id="recovery-email"
                        class="xps-recovery-input"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="name@company.com"
                    >

                    <span class="xps-recovery-input-icon">
                        @
                    </span>

                </div>

            </div>


            <button
                type="submit"
                class="xps-recovery-submit"
            >
                <span class="xps-recovery-submit-content">
                    Send Recovery Instructions
                    <span class="xps-recovery-submit-arrow">→</span>
                </span>
            </button>

        </form>


        <!-- BACK TO LOGIN -->
        <div class="xps-recovery-footer">

            Remembered your password?

            <a href="#login">
                Back to Sign In
            </a>

        </div>

    </div>

</div>
