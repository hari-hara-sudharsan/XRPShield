<div style="max-width: 480px; margin: 40px auto;">
    <div class="card" style="padding: 40px;">
        <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.8rem; margin: 0 auto 20px auto;">X</div>
        <h2 style="font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 8px;">Reset Password</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; margin-bottom: 32px;">
            Enter your registered email address to receive password reset instructions
        </p>

        <form id="forgot-form" onsubmit="event.preventDefault(); alert('Password reset verification link sent to your registered email address.'); window.location.hash = 'login';">
            <div style="margin-bottom: 24px; text-align: left;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">Email Address</label>
                <input type="email" required placeholder="name@company.com" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 16px; border-radius: 10px;">
            </div>

            <button type="submit" class="btn-connect" style="width: 100%; padding: 14px; font-size: 1rem; margin-bottom: 16px;">
                Send Recovery Instructions
            </button>
        </form>

        <div style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">
            Remembered password? <a href="#login" style="color: var(--primary-cyan); text-decoration: none;">Back to Sign In</a>
        </div>
    </div>
</div>
