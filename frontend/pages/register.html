<div style="max-width: 480px; margin: 40px auto;">
    <div class="card" style="padding: 40px;">
        <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.8rem; margin: 0 auto 20px auto;">X</div>
        <h2 style="font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 8px;">Create Account</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; margin-bottom: 32px;">
            Join XRPShield for privacy-preserving treasury management on Flare
        </p>

        <form id="register-form" onsubmit="event.preventDefault(); window.handleRegisterSubmit();">
            <div style="margin-bottom: 16px; text-align: left;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">Display Name</label>
                <input type="text" id="reg-name" required placeholder="e.g. Treasury Manager" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 16px; border-radius: 10px;">
            </div>

            <div style="margin-bottom: 16px; text-align: left;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@company.com" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 16px; border-radius: 10px;">
            </div>

            <div style="margin-bottom: 24px; text-align: left;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">Password (Min 8 characters)</label>
                <input type="password" id="reg-password" required minlength="8" placeholder="••••••••" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 16px; border-radius: 10px;">
            </div>

            <button type="submit" class="btn-connect" style="width: 100%; padding: 14px; font-size: 1rem; margin-bottom: 16px;">
                Register Account
            </button>
        </form>

        <div style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">
            Already have an account? <a href="#login" style="color: var(--primary-cyan); text-decoration: none;">Sign In</a>
        </div>
    </div>
</div>
