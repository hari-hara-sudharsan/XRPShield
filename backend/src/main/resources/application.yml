server:
  port: ${PORT:${APP_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: xrpshield-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:xrpshielddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 10000
      initialization-fail-timeout: 0

  jpa:
    open-in-view: false
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
        boot:
          allow_jdbc_metadata_access: false




management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

xrpshield:
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  flare:
    rpc-url: ${FLARE_RPC_URL:https://coston2-api.flare.network/ext/C/rpc}
    chain-id: ${CHAIN_ID:114}
  openai:
    api-key: ${OPENAI_API_KEY:disabled}


